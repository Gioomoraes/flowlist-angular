<main class="page">
  <header>
    <h1 class="logo">{{ title() }}</h1>
  </header>

  <app-task-form (taskAdded)="addTask($event)" />

  <section>
    @if (tasks().length > 0) {
      <p class="counter">{{ doneCount() }} de {{ tasks().length }} feitas</p>
      @for (task of tasks(); track task.id) {
        <app-task-item
          [task]="task"
          (toggled)="toggleTask($event)"
          (deleted)="deleteTask($event)"
        />
      }
    } @else {
      <div class="empty">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 8h6" />
          <path d="M9 12h6" />
          <path d="M9 16h3" />
        </svg>
        <p>Nada por aqui ainda. Que tal começar com uma tarefa pequena?</p>
      </div>
    }
  </section>
</main>
<router-outlet />
